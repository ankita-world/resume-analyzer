<!DOCTYPE html>
<html>
<head>
    <title>Resume Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card-custom {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* Upload Box */
        .upload-box {
            border: 2px dashed #c7d2fe;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            background: #f9fafb;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #eef2ff;
            border-color: #6366f1;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 8px rgba(99,102,241,0.4);
            border-color: #6366f1;
        }

        /* --- Button --- */
        .btn-custom {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.03);
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="card-custom">

        <h1>📄 Resume Analyzer</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Upload Section -->
            <div class="mb-4">
                <label class="form-label">Upload Resume (PDF)</label>

                <div class="upload-box">
                    <div class="upload-icon">📂</div>
                    <p class="text-muted mb-2">Drag & Drop or Click to Upload</p>
                    <input type="file" name="resume" class="form-control mt-2" accept=".pdf" required>
                </div>
            </div>

            <!-- Job Role -->
            <div class="mb-4">
                <label class="form-label">Job Role</label>
                <select name="job_role" class="form-select">
                    <option value="django">🚀 Django Developer</option>
                    <option value="data_scientist">📊 Data Scientist</option>
                    <option value="frontend">🎨 Frontend Developer</option>
                </select>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-custom w-100">
                Analyze Resume
            </button>

        </form>
    </div>

</body>
</html>
