<!DOCTYPE html>
<html>
<head>
    <title>Analysis Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            font-family: 'Inter', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card-custom {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 20px;
            background: #ffffff; /* white like second page */
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            white-space: nowrap;
            font-size: clamp(1.6rem, 3vw, 2.3rem);
        }

        .score-badge {
            font-size: 2rem;
            font-weight: 700;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .skills-good {
            background: #ecfdf5;
            color: #065f46;
            border-left: 6px solid #10b981;
        }

        .skills-missing {
            background: #fef2f2;
            color: #7f1d1d;
            border-left: 6px solid #ef4444;
        }

        .section-box {
            padding: 20px;
            border-radius: 14px;
            background: #f9fafb;
            height: 100%;
        }

        h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .list-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .list-group-item {
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            padding: 6px 10px;
            display: inline-block;
        }

        .skills-good.list-group-item {
            background: #d1fae5;
        }

        .skills-missing.list-group-item {
            background: #fee2e2;
        }

        .btn-custom {
            border-radius: 12px;
            font-weight: 600;
            padding: 12px;
            margin-top: 25px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
        }

        .btn-custom:hover {
            transform: scale(1.03);
        }

        @media (max-width: 768px) {
            .card-custom {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card-custom">

        <h1>Analysis Result</h1>

        <!-- Score -->
        <div class="score-badge mb-4 {% if score > 50 %}skills-good{% else %}skills-missing{% endif %}">
            Your Score: {{ score }}%
        </div>

        <div class="row g-4">

            <!-- Skills Found -->
            <div class="col-md-6">
                <div class="section-box">
                    <h3>Skills Found ({{ skills|length }})</h3>
                    <ul class="list-group">
                        {% for skill in skills %}
                            <li class="list-group-item skills-good">
                                ✔ {{ skill }}
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <!-- Missing Skills -->
            <div class="col-md-6">
                <div class="section-box">
                    <h3>Missing Skills ({{ missing|length }})</h3>
                    <ul class="list-group">
                        {% for skill in missing %}
                            <li class="list-group-item skills-missing">
                                ✖ {{ skill }}
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

        </div>

        <!-- Button -->
        <a href="/" class="btn btn-custom w-100">
            Analyze Another Resume
        </a>

    </div>

</body>
</html>
